[project]
name = "hdd-rul"
version = "0.1.0"
description = "Chaîne MLOps de prédiction de la durée de vie restante (RUL) des disques durs Backblaze"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
authors = [{ name = "Matteo Chretien" }]

dependencies = [
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "mlflow>=2.17",
    "prefect>=3.1",
    # <0.155 : FastAPI 0.155 supprime le paramètre déprécié `min_items`, encore
    # utilisé par le serveur Prefect 3.8 (server/api/concurrency_limits_v2.py).
    # Au-delà, plus aucun serveur Prefect ne démarre (éphémère comme conteneurisé) :
    # TypeError: Body() got an unexpected keyword argument 'min_items'.
    "fastapi>=0.115,<0.155",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6",
    "psycopg[binary]>=3.2",
    "great-expectations>=1.2",
    "requests>=2.32",
    "matplotlib>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "locust>=2.31",
]

[project.scripts]
hdd-rul = "hdd_rul.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hdd_rul", "api"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "api", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "ARG", "PTH"]
ignore = ["B008", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG001", "ARG002", "ARG005"]
# Great Expectations impose la signature des métriques personnalisées
# (premier argument `cls`, arguments de contexte non tous utilisés).
"src/hdd_rul/validation/custom.py" = ["ARG002", "N805"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --strict-markers"
markers = [
    "integration: tests nécessitant des services externes (MLflow, Postgres)",
]
filterwarnings = ["ignore::DeprecationWarning"]
