apiVersion: 1

datasources:
  - name: hdd-rul-postgres
    uid: hdd-rul-postgres
    type: postgres
    access: proxy
    url: postgres:5432
    database: ${HDD_RUL_DB}
    user: ${HDD_RUL_DB_USER}
    secureJsonData:
      password: ${HDD_RUL_DB_PASSWORD}
    jsonData:
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    isDefault: true
    editable: false
